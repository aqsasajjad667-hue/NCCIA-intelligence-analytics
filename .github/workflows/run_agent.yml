name: NCCIA Daily Intelligence Agent

on:
  schedule:
    # Roz subah 6:00 AM UTC par chalega
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual button se run karne ke liye

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4

      - name: Run Data Extraction Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
